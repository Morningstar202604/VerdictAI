name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff baseline)
        run: python -m ruff check app/

      - name: Tests (pytest)
        env:
          LLM_PROVIDER: mock
        run: python -m pytest -q

      - name: Compile all backend sources
        run: python -m compileall -q app ai_engine tools

      - name: Import app & engine
        env:
          LLM_PROVIDER: mock
        run: |
          python -c "from app.main import app; print('app import OK')"
          python -c "import ai_engine.server; print('engine import OK')"

      - name: API smoke test (mock engine)
        env:
          LLM_PROVIDER: mock
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          c = TestClient(app)

          r = c.get("/api/health")
          assert r.status_code == 200 and r.json()["status"] == "ok", r.text

          r = c.get("/api/cases")
          assert r.status_code == 200 and "cases" in r.json(), r.text

          r = c.get("/api/presets")
          assert r.status_code == 200 and r.json().get("presets"), r.text

          r = c.get("/api/knowledge")
          assert r.status_code == 200 and r.json().get("entries"), r.text

          r = c.get("/api/roles")
          assert r.status_code == 200 and r.json().get("roles"), r.text

          print("API smoke OK")
          PY

      - name: Evaluation regression (mock, offline)
        env:
          LLM_PROVIDER: mock
        run: python tools/evaluate.py --check --text "张明于2025年3月1日凌晨1点潜入李华的别墅窃取现金5000元与黄金饰品。现场勘查发现鞋印指纹与张明吻合，监控拍到背影相符。张明供述当晚饮酒后步行回家未进别墅，需判断其是否入室盗窃。"

  frontend:
    name: Frontend (inline app syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Built-in SPA syntax check
        run: |
          node -e "
          const fs=require('fs');
          for (const n of ['app-core','app-ui','app-shell']) {
            const p='backend/app/static/assets/'+n+'.js';
            new Function(fs.readFileSync(p,'utf8'));
          }
          const c=fs.readFileSync('backend/app/static/assets/app.css','utf8');
          if(c.length<1000) throw new Error('app.css too small');
          const h=fs.readFileSync('backend/app/static/index.html','utf8');
          if(!h.includes('/static/assets/app-core.js')) throw new Error('core.js link missing');
          if(!h.includes('/static/assets/app-ui.js')) throw new Error('ui.js link missing');
          if(!h.includes('/static/assets/app-shell.js')) throw new Error('shell.js link missing');
          if(!h.includes('id=\"tab-agent\"')) throw new Error('agent tab missing');
          if(!h.includes('id=\"tab-kb\"')) throw new Error('kb tab missing');
          if(!h.includes('id=\"sidebar\"')) throw new Error('sidebar missing');
          console.log('frontend OK')
          "

  ui-shell:
    name: UI shell contract (static + cold-tone)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 外壳契约（目录→面板联动 / 引用完整性 / 类名一致性）与冷色调基线。
      # 纯静态解析，不装 playwright，秒级完成。
      - name: Run UI shell tests
        run: python -m pytest tests/test_ui_shell.py -q
