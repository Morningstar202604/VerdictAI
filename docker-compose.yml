# ===== VerdictAI 生产部署 =====
# 用法：
#   cp backend/.env.example backend/.env   # 填写 LLM 密钥等配置
#   docker compose up -d --build
# 访问：内置 SPA（后端自带 UI） http://<server>:8787
# 说明：React 版前端已下线（2026-09），唯一前端为后端托管的
#       内置单页应用（backend/app/static/），无需额外服务。
services:
  backend:
    build: ./backend
    container_name: verdictai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内固定数据目录（app/config.py 相对路径基准 /app）
      DATA_DIR: /app/data
      SANDBOX_OUT_DIR: /app/data/sandbox_out
      # ── 沙箱安全（默认 auto：容器内无 docker.sock 会降级为 subprocess，
      #    专家代码以容器用户执行）。推荐改为 docker 后端隔离，需挂载 socket：
      #   volumes:
      #     - /var/run/docker.sock:/var/run/docker.sock
      #   environment:
      #     - CODE_SANDBOX_BACKEND=docker
      #     - CODE_SANDBOX_DOCKER_IMAGE=python:3.12-slim
      # 或在不依赖图表/计算时直接关闭：CODE_SANDBOX_ENABLED=false
    volumes:
      # 案例库 / 辩论记录 / 图表资产持久化
      - ./backend/data:/app/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3